<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>물음표 — 우리 반 공부 게시판</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7f9;color:#243440;font:16px/1.6 system-ui,"맑은 고딕",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{cursor:default;opacity:.5}button,input,textarea,select{border:1px solid #d8e1e7;border-radius:10px;padding:10px 14px}button{background:white;color:inherit}button:hover{border-color:#208363}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #83cbb2;outline-offset:2px}textarea{resize:vertical;min-height:110px;width:100%}input,select{max-width:100%;background:white;color:inherit}input[type=checkbox]{accent-color:#167354}h1,h2,h3,p{margin:0 0 12px}h1{font-size:32px;line-height:1.4;letter-spacing:-1px}h2{font-size:21px}h3{font-size:18px}small,.muted{color:#647583;font-size:14px}.layout{display:grid;grid-template-columns:240px 1fr;min-height:100vh}aside{background:#163d35;color:#eaf5ef;padding:34px 24px;display:flex;flex-direction:column;gap:28px}.brand{font-size:27px;font-weight:800;letter-spacing:-1px}.brand small{display:block;color:#a6cabb;font-weight:400;letter-spacing:0}nav{display:grid;gap:10px}nav button{text-align:left;background:transparent;color:#d8e9e1;border:0;padding:13px}nav button.active{background:#edf7ef;color:#184e3d;font-weight:700}.aside-note{margin-top:auto;font-size:14px;color:#bad1c5}.main{padding:30px 5vw 50px;max-width:1300px;width:100%;margin:auto}.top,.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.top{justify-content:space-between;margin-bottom:26px}.pill{background:#e8f4ed;color:#25654a;padding:5px 10px;border-radius:7px;font-size:14px;display:inline-block}.hero{background:#e4f1e9;border:1px solid #d0e5d8;border-radius:18px;padding:30px;margin-bottom:26px;position:relative}.hero p{color:#4d6a5e;margin:10px 0 0}.hero small{display:block;margin-bottom:12px;letter-spacing:2px;color:#386f54}.toolbar{display:flex;gap:10px;margin:18px 0}.toolbar input{flex:1;min-width:0}.primary{background:#1c7357;border-color:#1c7357;color:white}.secondary{background:#edf4f0}.card{background:white;border:1px solid #e0e6eb;border-radius:14px;padding:22px;margin:14px 0}.card-title{border:0;padding:0;background:none;font-size:19px;font-weight:700;text-align:left;display:block;margin:12px 0 8px}.card-title:hover{text-decoration:underline}.meta{display:flex;justify-content:space-between;gap:10px;align-items:center}.body{white-space:pre-wrap;overflow-wrap:anywhere}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.actions button{font-size:14px;padding:7px 11px}.selected{background:#e4f2e9;border-color:#68a78a}.empty{text-align:center;padding:40px 18px;color:#647583}.answer{border-top:1px solid #e2e9e5;padding-top:18px;margin-top:18px}.stack{display:grid;gap:14px}label{display:grid;gap:6px}label.check{display:flex;gap:10px;align-items:flex-start}.notice{background:#fff5dc;color:#725c26;border-radius:10px;padding:12px 16px;margin:16px 0;font-size:14px}.split{display:grid;grid-template-columns:230px 1fr;gap:18px}.conversation{max-height:380px;overflow:auto;display:grid;gap:12px;margin:18px 0;padding:3px}.bubble{background:#f0f3f6;padding:12px 16px;border-radius:13px;max-width:90%;justify-self:start}.bubble.mine{background:#e4f2e9;justify-self:end}.bubble small{display:block;margin-bottom:5px}.contact{display:block;width:100%;text-align:left;margin-bottom:10px}.contact small{display:block}dialog{border:0;border-radius:18px;padding:26px;width:min(620px,94vw);max-height:90vh;box-shadow:0 20px 80px #10251a40}dialog::backdrop{background:#0c241b70}.dialog-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.dialog-head h2{margin:0}.close{padding:4px 12px;font-size:23px}.full{width:100%}#toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#173e34;color:white;border-radius:12px;padding:13px 22px;z-index:5;max-width:90vw}footer{font-size:14px;color:#71808b;margin-top:30px}.counter{font-weight:700;color:#25664f}.intro{margin-bottom:20px}.intro p{color:#647583}.section-title{display:flex;align-items:baseline;gap:12px}.hint{background:#edf3f9;border-radius:10px;padding:12px 16px;font-size:14px;color:#465e76}
@media(max-width:800px){.layout{grid-template-columns:1fr}aside{padding:18px;gap:16px}.brand{font-size:23px}.brand small,.aside-note{display:none}nav{display:flex;gap:6px}nav button{flex:1;text-align:center;padding:10px 6px}.main{padding:22px 18px}.top{margin-bottom:18px}.hero{padding:22px}h1{font-size:26px}.split{grid-template-columns:1fr}.toolbar{flex-wrap:wrap}.toolbar input{flex-basis:60%}.card{padding:18px}.top label{width:100%}}
</style>
<div class="layout">
  <aside><div class="brand">물음표<span style="color:#9bd1b4">.</span><small>함께 배우는 우리 반</small></div>
    <nav aria-label="주 메뉴"><button data-view="board" class="active">공부 고민 게시판</button><button data-view="dm">1:1 질문</button><button data-view="library">우리 반 자료집</button></nav>
    <div class="aside-note">작은 질문 하나가<br>누군가의 배움이 되니까.<hr>SDGs 4 · 양질의 교육</div>
  </aside>
  <main class="main">
    <div class="top"><span class="pill">우리 반 공부 공간 · 체험판</span><label class="row"><small>체험 역할</small><select id="role" aria-label="체험 역할"><option value="student">질문하는 학생</option><option value="helper">답변하는 친구</option><option value="teacher">김배움 선생님 (가상)</option></select></label></div>
    <div class="hint">이 기기의 브라우저에만 저장되는 시제품입니다. 역할 전환은 체험용이며, 실제 학교 인증·비밀 대화·메시지 전송 기능은 없습니다.</div>
    <div id="screen"></div>
    <footer>물음표 · 모르는 것을 함께 알아가는 곳</footer>
  </main>
</div>
<dialog id="modal"><div class="dialog-head"><h2 id="modalTitle"></h2><button class="close" aria-label="닫기" id="closeModal">×</button></div><div id="modalBody"></div></dialog>
<div id="toast" role="status" hidden></div>
<script>
// 서버와 라이브러리 없이 동작하는 로컬 시제품입니다.
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const subjects = ['국어','수학','영어','과학','사회','공부법'];
const people = {student:'익명 학생',helper:'도움 준 친구',teacher:'김배움 선생님 (가상)'};
const key = 'question-mark-demo-v1';
const id = () => crypto.randomUUID();
const answer = (text, author='helper', likes=[]) => ({id:id(),text,author,likes,supplement:[],checked:false});
const post = (title,text,subject,answers=[],library=false) => ({id:id(),title,text,subject,unit:'',author:'student',answers,curious:[],library,date:new Date().toLocaleDateString('ko-KR')});
function initialData(){
  return {posts:[
    post('일차함수의 기울기, 왜 나누는 건가요?','그래프에서 x가 변한 양과 y가 변한 양을 왜 나누는지 이해하고 싶어요.','수학',[answer('기울기는 x가 1만큼 늘 때 y가 얼마나 변하는지 나타내요. x가 2 늘고 y가 6 늘었다면, 1당 변화량은 6 ÷ 2 = 3이에요.','teacher')]),
    post('국어 지문을 읽으면 시간이 너무 오래 걸려요','글을 다 읽고 문제를 보면 내용이 기억나지 않아요. 다들 어떻게 읽나요?','국어'),
    post('영어 단어, 오래 기억하는 방법이 궁금해요','외운 단어를 다음 날 잊어버려요. 어떤 방법으로 복습하면 좋을까요?','영어',[answer('단어만 외우기보다 짧은 예문을 직접 만들어 보세요. 다음 날, 3일 뒤, 일주일 뒤에 다시 떠올려 보는 것도 좋아요.')],true)
  ],threads:[{id:id(),recipient:'teacher',subject:'수학',unit:'일차함수',closed:false,published:false,consent:false,credit:false,messages:[{role:'student',text:'일차함수에서 기울기가 음수라는 건 무슨 뜻인가요?'},{role:'teacher',text:'x가 커질수록 y가 작아진다는 뜻이에요. y = -2x + 3에서는 x가 1 늘 때 y가 2 줄어들어요.'}]}]};
}
let db;
try { db=JSON.parse(localStorage.getItem(key)); if(!db || !Array.isArray(db.posts) || !Array.isArray(db.threads)) db=initialData(); }
catch { db=initialData(); }
let view='board', role='student', query='', subject='', currentThread=db.threads[0]?.id;
function toast(text){$('toast').textContent=text;$('toast').hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').hidden=true,4500);}
// 원본 대신 복사본을 저장한 뒤 반영해, 저장 실패 시 공개 상태가 바뀌지 않게 합니다.
function commit(change){const copy=structuredClone(db);change(copy);try{localStorage.setItem(key,JSON.stringify(copy));db=copy;return true;}catch{toast('저장하지 못했어요. 브라우저 저장 공간과 설정을 확인해 주세요.');return false;}}
function options(selected='',all=false){return (all?'<option value="">모든 과목</option>':'')+subjects.map(s=>`<option ${s===selected?'selected':''}>${s}</option>`).join('');}
function openModal(title,html){$('modalTitle').textContent=title;$('modalBody').innerHTML=html;$('modal').showModal();}
$('closeModal').onclick=()=>$('modal').close();
document.querySelector('nav').onclick=e=>{const b=e.target.closest('[data-view]');if(b){view=b.dataset.view;query='';subject='';render();}};
$('role').onchange=e=>{role=e.target.value;$('modal').close();render();};
function render(){
  document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));
  if(view==='dm')return renderDM();
  const library=view==='library';
  $('screen').innerHTML=`${library?'<div class="intro" style="margin-top:26px"><h1>함께 쌓은 배움, 우리 반 자료집</h1><p>공개에 동의한 대화와 질문을 과목·단원별로 찾아보세요.</p></div>':'<div class="hero" style="margin-top:22px"><small>EVERY QUESTION MATTERS</small><h1>여기서는, 모른다고 해도 괜찮아.</h1><p>혼자 고민하던 질문을 나누면, 함께 배울 수 있어요.</p><button class="primary" id="ask" style="margin-top:20px">익명으로 질문하기 ＋</button></div>'}
    <div class="section-title"><h2>${library?'공부 자료집':'친구들의 질문'}</h2><span class="muted" id="count"></span></div>
    <div class="toolbar"><input id="search" type="search" placeholder="질문, 답변, 단원 검색" aria-label="질문 검색" value="${esc(query)}"><select id="filter" aria-label="과목 필터">${options(subject,true)}</select></div><div id="posts"></div>`;
  if(!library)$('ask').onclick=ask;
  $('search').oninput=e=>{query=e.target.value;renderPosts();};$('filter').onchange=e=>{subject=e.target.value;renderPosts();};renderPosts();
}
function renderPosts(){
  const items=db.posts.filter(p=>(view!=='library'||p.library)&&(!subject||p.subject===subject)&&[p.title,p.text,p.unit,...p.answers.map(a=>a.text)].join(' ').toLowerCase().includes(query.trim().toLowerCase()));
  $('count').textContent=`${items.length}개의 질문`;
  $('posts').innerHTML=items.map(p=>`<article class="card"><div class="meta"><span class="pill">${esc(p.subject)}${p.unit?' · '+esc(p.unit):''}</span><small>${p.answers.length?'답변 '+p.answers.length+'개':'첫 답변을 기다려요'}</small></div><button class="card-title" data-open="${p.id}">${esc(p.title)}</button><p class="body muted">${esc(p.text.slice(0,130))}</p><div class="meta"><small>익명 학생 · ${esc(p.date)}</small><button data-curious="${p.id}" class="${p.curious.includes(role)?'selected':''}" aria-pressed="${p.curious.includes(role)}">나도 궁금해요 ${p.curious.length}</button></div></article>`).join('')||'<div class="card empty">아직 질문이 없어요. 다른 검색어를 입력하거나 첫 질문을 나눠 주세요.</div>';
  $('posts').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.open)detail(b.dataset.open);if(b.dataset.curious){toggleReaction(b.dataset.curious,null,'curious');renderPosts();}};
}
function ask(){
  openModal('작은 질문부터 시작해요',`<form id="askForm" class="stack"><label>과목<select name="subject">${options()}</select></label><label>단원 (선택)<input name="unit" maxlength="40" placeholder="예: 일차함수"></label><label>제목<input name="title" required maxlength="100" placeholder="어떤 부분이 궁금한가요?"></label><div><small>말로 정리하기 어렵다면 눌러 보세요.</small><div class="actions"><button type="button" data-hint="어디서부터 공부해야 할지 모르겠어요. 지금 어려운 부분은 ">어디서 시작하죠?</button><button type="button" data-hint="설명을 읽었지만 이 부분이 이해되지 않아요: ">이 부분이 막혀요</button></div></div><label>질문<textarea name="text" required maxlength="3000" placeholder="이름, 학번, 연락처는 적지 말아 주세요."></textarea></label><button class="primary">익명 질문 등록</button></form>`);
  const f=$('askForm');f.onclick=e=>{if(e.target.dataset.hint){f.elements.text.value=e.target.dataset.hint;f.elements.text.focus();}};
  f.onsubmit=e=>{e.preventDefault();const v=Object.fromEntries(new FormData(f));if(!v.title.trim()||!v.text.trim())return toast('제목과 질문을 입력해 주세요.');const p=post(v.title.trim(),v.text.trim(),v.subject);p.unit=v.unit.trim();p.author=role;if(commit(d=>d.posts.unshift(p))){$('modal').close();render();toast('질문을 등록했어요. 작은 용기를 응원해요!');}};
}
function toggleReaction(pid,aid,type){commit(d=>{const p=d.posts.find(p=>p.id===pid),target=aid?p.answers.find(a=>a.id===aid):p;const arr=target[type],i=arr.indexOf(role);i<0?arr.push(role):arr.splice(i,1);});}
function detail(pid){
  const p=db.posts.find(p=>p.id===pid);
  openModal(p.title,`<span class="pill">${esc(p.subject)} ${esc(p.unit)}</span><p class="body" style="margin-top:16px">${esc(p.text)}</p><h3 style="margin-top:22px">함께 나눈 답변 ${p.answers.length}개</h3>${[...p.answers].sort((a,b)=>b.likes.length-a.likes.length).map(a=>`<div class="answer"><div class="meta"><strong>${esc(people[a.author]||'익명 답변자')}</strong>${a.checked?'<span class="pill">교사 확인 · 체험</span>':''}</div><p class="body" style="margin-top:10px">${esc(a.text)}</p><div class="actions"><button data-aid="${a.id}" data-reaction="likes" class="${a.likes.includes(role)?'selected':''}" aria-pressed="${a.likes.includes(role)}">도움이 됐어요 ${a.likes.length}</button><button data-aid="${a.id}" data-reaction="supplement" class="${a.supplement.includes(role)?'selected':''}" aria-pressed="${a.supplement.includes(role)}">보충이 필요해요${a.author===role?' '+a.supplement.length+' (나만 보기)':''}</button>${role==='teacher'?`<button data-check="${a.id}">${a.checked?'확인 취소':'설명 확인'}</button>`:''}</div></div>`).join('')||'<p class="muted">아는 내용을 나누어 주세요. 첫 답변이 큰 도움이 돼요.</p>'}<form id="answerForm" class="stack" style="margin-top:22px"><label>${esc(people[role])} · 답변 작성<textarea name="text" required maxlength="3000" placeholder="풀이 과정이나 공부 경험을 적어 주세요."></textarea></label><button class="primary">답변 등록</button></form>`);
  $('modalBody').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.reaction){toggleReaction(pid,b.dataset.aid,b.dataset.reaction);$('modal').close();detail(pid);}if(b.dataset.check){if(commit(d=>{const a=d.posts.find(p=>p.id===pid).answers.find(a=>a.id===b.dataset.check);a.checked=!a.checked;})){$('modal').close();detail(pid);}}};
  $('answerForm').onsubmit=e=>{e.preventDefault();const text=new FormData(e.target).get('text').trim();if(!text)return;if(commit(d=>d.posts.find(p=>p.id===pid).answers.push(answer(text,role)))){$('modal').close();detail(pid);}};
}
function renderDM(){
  const visible=db.threads.filter(t=>role==='student'||t.recipient===role);
  let t=visible.find(t=>t.id===currentThread)||visible[0];if(t)currentThread=t.id;
  const canReply=t&&!t.closed&&(role==='student'||role===t.recipient);
  $('screen').innerHTML=`<div class="intro" style="margin-top:26px"><h1>조금 더 편하게, 1:1 질문</h1><p>실제 전송 없이 두 역할을 바꿔 가며 대화를 체험할 수 있어요.</p></div><div class="split"><div><button class="primary full" id="newDM" ${role!=='student'?'disabled':''}>새 질문 시작하기</button><div style="margin-top:14px">${visible.map(c=>`<button class="contact ${t?.id===c.id?'selected':''}" data-thread="${c.id}">${esc(people[c.recipient])}<small>${esc(c.subject)} · ${c.published?'자료집 공개':c.closed?'비공개 보관':'대화 중'}</small></button>`).join('')}</div></div><section class="card" style="margin-top:0">${t?`<div class="meta"><h2>${esc(people[t.recipient])}</h2><span class="pill">${esc(t.subject)}</span></div><small>질문자는 익명 학생으로 표시됩니다.</small><div class="conversation" id="messages">${t.messages.map(m=>`<div class="bubble ${m.role===role?'mine':''}"><small>${esc(people[m.role])}</small><div class="body">${esc(m.text)}</div></div>`).join('')}</div>${canReply?'<form id="messageForm" class="stack"><label>메시지<textarea name="text" required maxlength="3000" placeholder="편하게 질문하거나 답해 주세요."></textarea></label><button class="primary">메시지 저장 (체험)</button></form>':''}${!t.closed&&role===t.recipient?`<div class="notice"><label class="check"><input id="consent" type="checkbox" ${t.consent?'checked':''}>대화 내용을 익명 자료로 공개하는 데 동의해요.</label>${role==='helper'?`<label class="check" style="margin-top:10px"><input id="credit" type="checkbox" ${t.credit?'checked':''}>자료집에 ‘도움 준 친구’로 표시해 주세요.</label>`:''}</div>`:''}${!t.closed&&role==='student'?`<div class="actions"><button id="keepPrivate">비공개로 대화 마치기</button><button id="publishDraft" ${!t.consent||!t.messages.some(m=>m.role===t.recipient)?'disabled':''}>익명 공개 검토하기</button></div><p class="muted" style="margin-top:10px">질문자가 비공개를 선택하면 공개하지 않아요. 공개하려면 답변 역할에서 동의하고 답변을 남겨 주세요.</p>`:''}${t.closed?`<div class="notice">${t.published?'검토한 정리본이 자료집에 등록됐어요.':'이 대화는 자료집에 공개하지 않고 보관했어요.'}</div>`:''}`:'<div class="empty">이 역할의 대화가 없어요.<br>질문하는 학생 역할에서 새 질문을 시작해 주세요.</div>'}</section></div>`;
  $('newDM').onclick=newDM;
  document.querySelectorAll('[data-thread]').forEach(b=>b.onclick=()=>{currentThread=b.dataset.thread;renderDM();});
  if(!t)return;
  if($('messageForm'))$('messageForm').onsubmit=e=>{e.preventDefault();const text=new FormData(e.target).get('text').trim();if(text&&commit(d=>d.threads.find(c=>c.id===t.id).messages.push({role,text})))renderDM();};
  for(const field of ['consent','credit'])if($(field))$(field).onchange=e=>{const checked=e.target.checked;if(!commit(d=>d.threads.find(c=>c.id===t.id)[field]=checked))e.target.checked=!checked;};
  if($('keepPrivate'))$('keepPrivate').onclick=()=>{if(commit(d=>d.threads.find(c=>c.id===t.id).closed=true)){renderDM();toast('공개하지 않고 보관했어요.');}};
  if($('publishDraft'))$('publishDraft').onclick=()=>publishDraft(t);
  const messages=$('messages');messages.scrollTop=messages.scrollHeight;
}
function newDM(){
  openModal('누구에게 물어볼까요?',`<form id="dmForm" class="stack"><label>답변 받을 사람<select name="recipient"><option value="teacher">김배움 선생님 (가상)</option><option value="helper">도움 주는 친구 (체험)</option></select></label><label>과목<select name="subject">${options()}</select></label><label>단원 (선택)<input name="unit" maxlength="40"></label><label>첫 질문<textarea name="text" required maxlength="3000" placeholder="어디가 어려운지 모르겠다고 적어도 괜찮아요."></textarea></label><button class="primary">대화 시작</button></form>`);
  $('dmForm').onsubmit=e=>{e.preventDefault();const v=Object.fromEntries(new FormData(e.target));if(!v.text.trim())return;const t={id:id(),recipient:v.recipient,subject:v.subject,unit:v.unit.trim(),closed:false,published:false,consent:false,credit:false,messages:[{role:'student',text:v.text.trim()}]};if(commit(d=>d.threads.unshift(t))){currentThread=t.id;$('modal').close();renderDM();toast('저장했어요. 답변 역할로 바꿔 대화를 이어 보세요.');}};
}
// 정규식으로 알려진 형식만 가립니다. 이름 등은 반드시 사람이 추가 확인해야 합니다.
function redact(text){return text.replace(/[\w.+-]+@[\w.-]+\.[a-zA-Z]{2,}/g,'[이메일 삭제]').replace(/01[016789][-\s]?\d{3,4}[-\s]?\d{4}/g,'[연락처 삭제]').replace(/\d+\s*학년\s*\d+\s*반(?:\s*\d+\s*번)?/g,'[학급 삭제]').replace(/\d+\s*반\s*\d+\s*번/g,'[학급 삭제]').replace(/(이름|성명|학번)\s*[:：]\s*[가-힣a-zA-Z0-9]+/g,'[개인정보 삭제]');}
function publishDraft(t){
  openModal('공개 전, 정리본을 확인해 주세요',`<form id="publishForm" class="stack"><div class="notice">전화번호·이메일·일부 학급 표기를 가렸어요. 이름과 다른 개인정보가 남을 수 있으니 직접 지워 주세요. 원본 대화는 공개되지 않습니다.</div><label>자료집 제목<input name="title" required maxlength="100" placeholder="개인정보 없이 학습 주제를 적어 주세요."></label><label>단원 (선택)<input name="unit" maxlength="40" value="${esc(redact(t.unit))}"></label><label>정리한 질문<textarea name="question" required maxlength="5000">${esc(redact(t.messages.filter(m=>m.role==='student').map(m=>m.text).join('\n\n')))}</textarea></label><label>정리한 답변<textarea name="response" required maxlength="5000">${esc(redact(t.messages.filter(m=>m.role===t.recipient).map(m=>m.text).join('\n\n')))}</textarea></label><label class="check"><input type="checkbox" name="review" required>제목·단원·질문·답변에 이름, 학번, 연락처 등 개인정보가 없는지 직접 확인했고 공개에 동의해요.</label><button class="primary">검토한 정리본 공개하기</button></form>`);
  $('publishForm').onsubmit=e=>{e.preventDefault();const v=Object.fromEntries(new FormData(e.target));if(!v.title.trim()||!v.question.trim()||!v.response.trim())return toast('제목, 질문과 답변을 모두 입력해 주세요.');if([v.title,v.unit,v.question,v.response].some(s=>redact(s)!==s))return toast('공개를 잠시 멈췄어요. 남아 있는 개인정보를 지워 주세요.');const c=db.threads.find(c=>c.id===t.id);if(role!=='student'||!c.consent||c.closed)return toast('공개 동의와 대화 상태를 확인해 주세요.');const p=post(v.title.trim(),v.question.trim(),c.subject,[answer(v.response.trim(),c.recipient==='helper'?(c.credit?'helper':'anonymous'):'anonymous')],true);p.unit=v.unit.trim();if(commit(d=>{d.posts.unshift(p);const thread=d.threads.find(c=>c.id===t.id);thread.closed=true;thread.published=true;})){$('modal').close();view='library';render();toast('검토한 정리본을 자료집에 등록했어요.');}};
}
render();
</script>
</html>
